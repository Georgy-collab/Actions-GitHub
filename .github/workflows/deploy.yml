# Сборка Docker-образа → пуш в GHCR → деплой на сервер по SSH
name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # ручной запуск из вкладки Actions

env:
  # Имя образа в GHCR: ghcr.io/<владелец>/<репозиторий>
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: собрать образ и запушить в GitHub Container Registry
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name (lowercase)
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:latest,${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ---------------------------------------------------------------------------
  # Job 2: по SSH на сервер — pull из GHCR и запуск контейнера
  # Нужные секреты репозитория:
  #   SSH_HOST         — IP или хост сервера
  #   SSH_USER         — пользователь SSH
  #   SSH_PRIVATE_KEY  — приватный ключ (содержимое .pem / id_rsa)
  #   SSH_PORT         — порт SSH (обычно 22)
  #   GHCR_TOKEN       — PAT с правом read:packages (для docker login на сервере)
  # ---------------------------------------------------------------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            docker pull "$IMAGE:latest"

            docker stop time-api || true
            docker rm time-api || true

            docker run -d \
              --name time-api \
              --restart unless-stopped \
              -p 8000:8000 \
              "$IMAGE:latest"

            docker logout ghcr.io
            docker image prune -f
